<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adobe Photoshop Basic Tools - Presentation & Activity Deck</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Photoshop Dark Theme & Clean High-Visibility Typography */
    :root {
      --ps-dark: #09090b;
      --ps-card: #141418;
      --ps-border: #282836;
      --ps-blue: #007acc;
      --ps-blue-bright: #31a8ff;
    }

    body {
      background-color: var(--ps-dark);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    /* Ambient Photoshop Grid Canvas Background */
    .ps-canvas-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 122, 204, 0.08) 0%, transparent 70%),
        linear-gradient(45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%), 
        linear-gradient(-45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.015) 75%), 
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.015) 75%);
      background-size: 100% 100%, 36px 36px, 36px 36px, 36px 36px, 36px 36px;
      background-position: 0 0, 0 0, 0 18px, 18px -18px, -18px 0px;
    }

    /* Giant Background Watermark Text */
    .hero-watermark {
      font-size: 15vw;
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.03);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .watermark-morph {
      animation: watermarkZoom 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes watermarkZoom {
      0% {
        transform: scale(0.85);
        letter-spacing: 0.06em;
        opacity: 0.01;
      }
      50% {
        opacity: 0.045;
      }
      100% {
        transform: scale(1);
        letter-spacing: -0.04em;
        opacity: 0.03;
      }
    }

    /* Stage Perspective for 3D Transitions */
    .stage-3d-wrapper {
      perspective: 1400px;
      perspective-origin: center center;
      transform-style: preserve-3d;
    }

    /* Slide In / Out Directional 3D Parallax Animations */
    @keyframes slideInFromRight {
      0% {
        opacity: 0;
        transform: perspective(1400px) translateX(90px) translateZ(-70px) rotateY(-9deg) scale(0.93);
        filter: blur(6px);
      }
      65% {
        transform: perspective(1400px) translateX(-6px) translateZ(10px) rotateY(1deg) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: perspective(1400px) translateX(0) translateZ(0) rotateY(0deg) scale(1);
        filter: blur(0px);
      }
    }
    @keyframes slideInFromLeft {
      0% {
        opacity: 0;
        transform: perspective(1400px) translateX(-90px) translateZ(-70px) rotateY(9deg) scale(0.93);
        filter: blur(6px);
      }
      65% {
        transform: perspective(1400px) translateX(6px) translateZ(10px) rotateY(-1deg) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: perspective(1400px) translateX(0) translateZ(0) rotateY(0deg) scale(1);
        filter: blur(0px);
      }
    }
    .anim-slide-in-right {
      animation: slideInFromRight 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .anim-slide-in-left {
      animation: slideInFromLeft 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Digital Laser Shutter Sweep (Beam Flare Across Screen) */
    .laser-sweep {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(0, 122, 204, 0.0) 25%, 
        rgba(49, 168, 255, 0.3) 46%, 
        rgba(255, 255, 255, 0.95) 50%, 
        rgba(49, 168, 255, 0.3) 54%, 
        rgba(0, 122, 204, 0.0) 75%, 
        transparent 100%
      );
      opacity: 0;
      transform: translateX(-100%);
    }
    .anim-laser-forward {
      animation: laserSweepFwd 0.52s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .anim-laser-backward {
      animation: laserSweepBwd 0.52s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes laserSweepFwd {
      0% { opacity: 0; transform: translateX(-100%) skewX(-20deg); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translateX(100%) skewX(-20deg); }
    }
    @keyframes laserSweepBwd {
      0% { opacity: 0; transform: translateX(100%) skewX(20deg); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-100%) skewX(20deg); }
    }

    /* Tool Hero 3D Kinetic Morph Pop */
    @keyframes iconMorphPop {
      0% {
        transform: scale(0.65) rotate(-12deg) translateY(20px);
        opacity: 0;
        filter: drop-shadow(0 0 0 transparent);
      }
      65% {
        transform: scale(1.08) rotate(3deg) translateY(-6px);
        filter: drop-shadow(0 0 45px rgba(49, 168, 255, 0.8));
      }
      100% {
        transform: scale(1) rotate(0deg) translateY(0);
        opacity: 1;
        filter: drop-shadow(0 25px 60px rgba(0, 122, 204, 0.5));
      }
    }
    .anim-icon-morph {
      animation: iconMorphPop 0.68s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Shockwave Neon Ring Burst */
    .shockwave-ring {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 9999px;
      border: 3px solid #31a8ff;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }
    .anim-shockwave {
      animation: shockwaveExpand 0.75s cubic-bezier(0.1, 0.85, 0.3, 1) forwards;
    }
    @keyframes shockwaveExpand {
      0% {
        transform: scale(0.5);
        opacity: 1;
        box-shadow: 0 0 35px #31a8ff, inset 0 0 20px #31a8ff;
      }
      100% {
        transform: scale(3.8);
        opacity: 0;
        box-shadow: 0 0 60px transparent, inset 0 0 30px transparent;
      }
    }

    /* Smooth Gliding Tool Graphic Transition */
    .tool-hero-container {
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* Center State */
    .state-centered {
      transform: translateX(0%) scale(1.1);
    }
    /* Side State - Left (Gigilid sa Kaliwa -> Def sa Kanan) */
    .state-side-left {
      transform: translateX(-34%) scale(1.05);
    }
    /* Side State - Right (Gigilid sa Kanan -> Def sa Kaliwa) */
    .state-side-right {
      transform: translateX(34%) scale(1.05);
    }

    /* Definition Card Pop-Up Animations with 3D Depth */
    .def-card-pop {
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }
    .def-hidden-right {
      opacity: 0;
      transform: perspective(1000px) translateX(120px) rotateY(-18deg) scale(0.88);
      pointer-events: none;
      filter: blur(8px);
    }
    .def-hidden-left {
      opacity: 0;
      transform: perspective(1000px) translateX(-120px) rotateY(18deg) scale(0.88);
      pointer-events: none;
      filter: blur(8px);
    }
    .def-visible {
      opacity: 1;
      transform: perspective(1000px) translateX(0px) rotateY(0deg) scale(1);
      pointer-events: auto;
      filter: blur(0px);
    }

    /* Staggered Children Animation */
    .stagger-item {
      opacity: 0;
      transform: translateY(16px);
      animation: staggerFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stagger-1 { animation-delay: 0.08s; }
    .stagger-2 { animation-delay: 0.16s; }
    .stagger-3 { animation-delay: 0.24s; }
    .stagger-4 { animation-delay: 0.32s; }

    @keyframes staggerFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating Tool Icon Animation */
    @keyframes icon-float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.03); }
    }
    .anim-icon-float {
      animation: icon-float 4s ease-in-out infinite;
    }

    .blue-glow {
      background: radial-gradient(circle, rgba(0, 122, 204, 0.35) 0%, rgba(49, 168, 255, 0.12) 45%, transparent 75%);
    }

    /* Keycap Styling */
    .keycap-3d {
      background: linear-gradient(180deg, #2b2b36 0%, #121218 100%);
      box-shadow: 0 8px 0 #08080c, 0 12px 25px rgba(0, 122, 204, 0.4);
    }

    /* ========================================================
       FUNCTIONAL TOOL MOTION ANIMATIONS (HOW EACH TOOL WORKS)
       ======================================================== */

    /* Move Tool: 4-Way Directional Arrows & Layer Bounding Box */
    @keyframes moveDriftBox {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(14px, -12px); }
      50% { transform: translate(-14px, 12px); }
      75% { transform: translate(12px, 14px); }
    }
    @keyframes pulseArrowUp {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-10px); opacity: 1; filter: drop-shadow(0 0 10px #31a8ff); }
    }
    @keyframes pulseArrowDown {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(10px); opacity: 1; filter: drop-shadow(0 0 10px #31a8ff); }
    }
    @keyframes pulseArrowLeft {
      0%, 100% { transform: translateX(0); opacity: 0.35; }
      50% { transform: translateX(-10px); opacity: 1; filter: drop-shadow(0 0 10px #31a8ff); }
    }
    @keyframes pulseArrowRight {
      0%, 100% { transform: translateX(0); opacity: 0.35; }
      50% { transform: translateX(10px); opacity: 1; filter: drop-shadow(0 0 10px #31a8ff); }
    }

    /* Marquee Tool: Marching Ants Dash Loop */
    @keyframes marchingAntsLoop {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 36; }
    }
    @keyframes marqueeGlowPulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 18px rgba(49, 168, 255, 0.7)); }
    }

    /* Lasso Tool: Glowing Freehand Rope Path & Orbit Knot */
    @keyframes lassoStrokeDraw {
      0% { stroke-dashoffset: 800; opacity: 0.3; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 14px #31a8ff); }
      100% { stroke-dashoffset: -800; opacity: 0.3; }
    }
    @keyframes lassoOrbitSparkle {
      0% { transform: rotate(0deg) translateX(150px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
    }

    /* Crop Tool: Bounding Squeeze & Rule-of-Thirds Grid */
    @keyframes cropBoundingCycle {
      0%, 100% { transform: scale(1.08); }
      50% { transform: scale(0.92); }
    }
    @keyframes cropGridBreathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* Brush Tool: Paint Splash Arc & Color Droplets */
    @keyframes paintStrokeDraw {
      0% { stroke-dashoffset: 700; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 15px #ff007f); }
      100% { stroke-dashoffset: -700; opacity: 0.2; }
    }
    @keyframes paintOrbitSwirl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes brushTipPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Eraser Tool: Transparency Pattern Wipe & Pixel Dissolve */
    @keyframes eraserWipeBar {
      0%, 100% { transform: translateX(-50px) rotate(-15deg); opacity: 0.3; }
      50% { transform: translateX(50px) rotate(15deg); opacity: 1; }
    }
    @keyframes pixelParticleFade1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      100% { transform: translate(45px, -35px) scale(0); opacity: 0; }
    }
    @keyframes pixelParticleFade2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      100% { transform: translate(-40px, 35px) scale(0); opacity: 0; }
    }
    @keyframes pixelParticleFade3 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      100% { transform: translate(35px, 40px) scale(0); opacity: 0; }
    }

    /* Type Tool: Typing Text Animation & Floating Glyphs */
    @keyframes typingTextPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes floatGlyphLetter {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-16px) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 10px #31a8ff); }
    }

    /* Zoom Tool: Expanding Optical Radar Waves */
    @keyframes zoomRadarRings {
      0% { transform: scale(0.65); opacity: 0.9; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    @keyframes zoomGridMagnify {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
  </style>
</head>
<body class="ps-canvas-bg h-screen flex flex-col justify-between px-3 py-1.5 md:px-6 md:py-2.5 lg:px-8 lg:py-3 relative select-none overflow-hidden">

  <!-- DIGITAL LASER SHUTTER SWEEP OVERLAY -->

  <!-- BACKGROUND WATERMARK TEXT -->

  <!-- PRESENTATION SCRIPT ENGINE WITH AUTHENTIC PHOTOSHOP TOOL ICONS -->

      move: `

    // TRANSITION FX TRIGGERS
    function triggerLaserSweep(dir = 1) {
      if (!laserSweep) return;
      laserSweep.classList.remove('anim-laser-forward', 'anim-laser-backward');
      void laserSweep.offsetWidth; // Force Reflow
      laserSweep.classList.add(dir >= 0 ? 'anim-laser-forward' : 'anim-laser-backward');
    }

    function triggerShockwave() {
      if (!shockwaveRing) return;
      shockwaveRing.classList.remove('anim-shockwave');
      void shockwaveRing.offsetWidth; // Force Reflow
      shockwaveRing.classList.add('anim-shockwave');
    }

    // TYPEWRITER ENGINE (TYPES & ERASES "HELLO WORLD" CONTINUOUSLY)
    let typewriterInterval = null;
    let typewriterTimeout = null;

    function stopTypewriter() {
      if (typewriterInterval) clearInterval(typewriterInterval);
      if (typewriterTimeout) clearTimeout(typewriterTimeout);
      typewriterInterval = null;
      typewriterTimeout = null;
    }

    function runTypewriter() {
      stopTypewriter();
      const target = document.getElementById('typewriter-text');
      if (!target) return;

      const phrase = "HELLO WORLD";
      let curLength = 0;
      let isBackspacing = false;
      target.textContent = "";

      function step() {
        const el = document.getElementById('typewriter-text');
        if (!el) {
          stopTypewriter();
          return;
        }

        if (!isBackspacing) {
          curLength++;
          el.textContent = phrase.substring(0, curLength);
          if (curLength >= phrase.length) {
            isBackspacing = true;
            clearInterval(typewriterInterval);
            typewriterTimeout = setTimeout(() => {
              typewriterInterval = setInterval(step, 80); // Fast erasing speed
            }, 1400); // Pause to read "HELLO WORLD"
            return;
          }
        } else {
          curLength--;
          el.textContent = phrase.substring(0, curLength);
          if (curLength <= 0) {
            isBackspacing = false;
            clearInterval(typewriterInterval);
            typewriterTimeout = setTimeout(() => {
              typewriterInterval = setInterval(step, 130); // Typing speed
            }, 500); // Pause before re-typing
            return;
          }
        }
      }

      typewriterInterval = setInterval(step, 130);
    }

          <div class="bg-[#141418] border-2 border-[#282836] p-5 lg:p-6 rounded-2xl text-amber-300 text-xl md:text-2xl lg:text-3xl font-extrabold leading-snug">

            <div class="bg-[#3a3a3a] border-4 border-[#5a5a5a] p-5 lg:p-7 rounded-3xl flex flex-col items-center justify-center relative shadow-xl group hover:border-[#31a8ff]">
              <span class="absolute top-3 left-3 bg-[#007acc] text-white font-black text-base lg:text-xl w-9 h-9 lg:w-11 lg:h-11 rounded-full flex items-center justify-center shadow">3</span>

              <span class="absolute top-3 left-3 bg-[#007acc] text-white font-black text-base lg:text-xl w-9 h-9 lg:w-11 lg:h-11 rounded-full flex items-center justify-center shadow">4</span>
              <svg class="w-28 h-28 md:w-36 md:h-36 lg:w-40 lg:h-40 xl:w-44 xl:h-44 text-white group-hover:scale-110 transition drop-shadow-md" viewBox="0 0 100 100" fill="none" stroke="currentColor">

              <span class="absolute top-3 left-3 bg-[#007acc] text-white font-black text-base lg:text-xl w-9 h-9 lg:w-11 lg:h-11 rounded-full flex items-center justify-center shadow">5</span>

              <div class="flex items-center gap-3 mb-1.5">

                <span class="bg-[#282836] text-amber-300 font-mono text-sm lg:text-lg font-bold px-5 py-2 rounded-xl border border-amber-500/40">1/2 Crosswise</span>

            <div class="bg-[#09090b] border-4 border-[#31a8ff] p-5 lg:p-6 rounded-3xl text-center shadow-xl">

            <div class="bg-[#141418] border-2 border-[#282836] p-7 lg:p-9 rounded-2xl text-blue-300 text-2xl md:text-3xl lg:text-4xl xl:text-5xl font-extrabold leading-relaxed shadow-inner">
              <strong>Instructions:</strong> Search for five (5) additional Photoshop tools that were not discussed today. Write the name of each tool, its keyboard shortcut (if applicable), and explain its function in one to two sentences. Write your answers on a 1/2 crosswise sheet of paper.

          </div>
        `;
      }
    }

    // SET STAGE STATE FOR TOOL SLIDES
    function setSideState(side) {
      isSideState = side;
      const isRightSidePop = (currentIndex % 2 === 0);

      if (side) {
        // Trigger luminous cyan shockwave ring burst!
        triggerShockwave();

        if (isRightSidePop) {
          toolHero.className = "tool-hero-container state-side-left absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none";
          defCard.classList.remove('def-hidden-right');
          defCard.classList.add('def-visible');
        } else {
          toolHero.className = "tool-hero-container state-side-right absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none";
          defCard.classList.remove('def-hidden-left');
          defCard.classList.add('def-visible');
        }
        revealDefBtn.classList.add('hidden');
      } else {
        toolHero.className = "tool-hero-container state-centered absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none";
        defCard.classList.remove('def-visible');
        if (isRightSidePop) defCard.classList.add('def-hidden-right');
        else defCard.classList.add('def-hidden-left');
        revealDefBtn.classList.remove('hidden');
      }
    }

    // BUTTON ACTIONS
    revealDefBtn.addEventListener('click', () => setSideState(true));

    nextBtn.addEventListener('click', () => {
      if (currentIndex >= 10) {
        if (currentIndex < slides.length - 1) goToSlide(currentIndex + 1, false, 1);
        return;
      }

      const isToolSlide = (currentIndex >= 2 && currentIndex <= 7);

      if (isToolSlide && !isSideState) {
        setSideState(true);
      } else {
        if (currentIndex < slides.length - 1) {
          goToSlide(currentIndex + 1, false, 1);
        }
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex >= 10) {
        goToSlide(currentIndex - 1, false, -1);
        return;
      }

      const isToolSlide = (currentIndex >= 2 && currentIndex <= 7);

      if (isToolSlide && isSideState) {
        setSideState(false);
      } else {
        if (currentIndex > 0) {
          goToSlide(currentIndex - 1, true, -1);
        }
      }
    });

    // TIMER HELPERS (BRISK & SMOOTH COUNTDOWN TICK RATE - SAKTO LANG)
    function startCustomTimer(duration) {
      clearInterval(activityTimer);
      activitySeconds = duration;
      const display = document.getElementById('act-timer-display');

      const updateDisplay = () => {
        const mins = String(Math.floor(activitySeconds / 60)).padStart(2, '0');
        const secs = String(activitySeconds % 60).padStart(2, '0');
        if (display) display.textContent = `${mins}:${secs}`;
      };

      updateDisplay();

      activityTimer = setInterval(() => {
        activitySeconds--;
        updateDisplay();

        if (activitySeconds <= 0) {
          clearInterval(activityTimer);
          if (display) display.textContent = "00:00 TIME UP!";
        }
      }, 880); // Brisk 880ms interval tick rate
    }

    function toggleAnswerKey() {
      const box = document.getElementById('answer-key-box');
      if (box) box.classList.toggle('hidden');
    }

    // KEYBOARD NAVIGATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextBtn.click();
      } else if (e.key === 'ArrowLeft') {
        prevBtn.click();
      }
    });

    // AUTO PLAY ENGINE
    document.getElementById('auto-play-btn').addEventListener('click', () => {
      isAutoPlaying = !isAutoPlaying;
      const playText = document.getElementById('play-text');
      if (isAutoPlaying) {
        playText.textContent = "Pause";
        autoPlayTimer = setInterval(() => {
          if (currentIndex < 10) {
            const isToolSlide = (currentIndex >= 2 && currentIndex <= 7);
            if (isToolSlide && !isSideState) setSideState(true);
            else goToSlide(currentIndex + 1, false);
          } else {
            if (currentIndex < slides.length - 1) goToSlide(currentIndex + 1);
            else goToSlide(0, false);
          }
        }, 3500);
      } else {
        playText.textContent = "Auto Play";
        clearInterval(autoPlayTimer);
      }
    });

    // INITIALIZE
    goToSlide(0, false);
  </script>
